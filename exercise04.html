         function calculateSalariesSum(salaries) {
            const arrayOfSalaries = Object.values(salaries);
            let sum = 0;
            if (arrayOfSalaries.length == 0) {
                return sum;
            }
            arrayOfSalaries.forEach(val => sum += val);
            return sum;
        }

        function multiplyNumeric(obj) {
            for (const key in obj) {
                let keyVal = obj[key];
                if (typeof (keyVal) === "number") {
                    keyVal *= 2;
                    obj[key] = keyVal;
                }

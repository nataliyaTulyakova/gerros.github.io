<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/registform.css">

</head>

<body>
    
    <!-- Кнопка для виклику вікна -->
    <button id="openModalBtn">Зареєструватися</button>
    <a class="back-link" href="index.html">Home</a>
    <!-- Модальне вікно -->
    <dialog id="regModal">
        <div class="modal-header">
            <h2>Реєстрація</h2>
            <button id="closeModalBtn" class="close-btn">&times;</button>
        </div>

        <form id="regForm">
            <div class="form-group">
                <label for="username">Ім'я користувача:</label>
                <input type="text" id="username" name="username" required minlength="3" autofocus>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required minlength="6">
                    <button type="button" class="toggle-password" data-target="password" aria-label="Показати пароль">
                        <!-- Іконка відкритого ока (за замовчуванням прихована) -->
                        <svg class="eye-open hidden" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor"
                            stroke-width="2" fill="none">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <!-- Іконка закритого ока (показується першою) -->
                        <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor"
                            stroke-width="2" fill="none">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 
                            18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 
                            3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"> </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <!-- Поле підтвердження пароля -->
            <div class="form-group">
                <label for="confirmPassword">Підтвердіть пароль:</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                    <button type="button" class="toggle-password" data-target="confirmPassword"
                        aria-label="Показати підтвердження пароля"><svg hidden = "true"  class="eye-open hidden" 
                        viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor"
                            stroke-width="2" fill="none">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 
                            5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 
                            3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg></button>
                </div>
                <!-- Місце для виведення тексту помилки -->
                <span id="passwordError" class="error-text"></span>
            </div>

            <button type="submit" class="submit-btn">Створити акаунт</button>
        </form>
    </dialog>
        
    <script src="js/registform.js"></script>
</body>

</html>

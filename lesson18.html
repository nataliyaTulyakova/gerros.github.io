<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 18</title>
    <link rel="icon" type="image/x-icon" href="icon.ico?v=2" />
    <link rel="stylesheet" href="css/lesson18.css">
</head>

<body>
    <div class="calculator-container">
        <h2>Калькулятор</h2>
        <div id = "simple-calculator" class = "calculator">
            <div class="display-calculator">
                <input type="text" id="display" readonly></input>
            </div>
            
            <div class="culculator-buttons">
                <button type="button" data-value="7">7</button>
                <button type="button" data-value="8">8</button>
                <button type="button" data-value="9">9</button>
                <button type="button" data-operation="divide">&divide;</button>

                <button type="button" data-value="4">4</button>
                <button type="button" data-value="5">5</button>
                <button type="button" data-value="6">6</button>
                <button type="button" data-operation="multiply">&times;</button>

                <button type="button" data-value="1">1</button>
                <button type="button" data-value="2">2</button>
                <button type="button" data-value="3">3</button>
                <button type="button" data-operation="subtract">-</button>

                <button type="button" data-value="0">0</button>
                <button type="button" data-decimal=".">.</button>
                <button type="button" data-action="clear">C</button>
                <button type="button" data-operation="add">+</button>

                <button type="button" data-action="calculate">=</button>
            </div>
        </div>
    </div>
<div>
        <a class="back-link" href="index.html">Home</a>
</div>
<script src="js/calculator.js"></script> 
</body>

</html>

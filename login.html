<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="icon" type="image/x-icon" href="icon.ico?v=2" /> 
    <link rel="stylesheet" href="css/styles.css?v=1.2" />
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2 class="login-title">Access Your Account</h2>
                <p>Please enter your e-mail and password</p>
            </div>
    <form action="/login" method="POST" id="loginForm" class="login-form" autocomplete="off" novalidate>
        <fieldset>
            <div class="form-group">
                <div class="input-wrapper">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                </div>
                <span class="error-message" id="emailError">Error!</span>
            </div>
            <div class="form-group">
                <div class="input-wrapper password-wrapper">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>                
                <span class="error-message" id="passwordError">Error!</span>
            </div>
             <div class="form-options remember-wrapper">
                <label for="remember">Remember me</label>
                <input type="checkbox" id="remember" name="remember">
            </div>
        </fieldset>
            <button type="submit" class="login-btn">Log In</button> 
   </form> 
   <div class="divider">
            <span class="login-span">or sign in with</span>
        </div>
        <div class="soc-options">
            <button class="soc-btn"><a href="https://www.github.com" target="_blank">
              <i class="fab fa-github"></i></a></button>
            <button class="soc-btn"><a href="https://www.google.com" target="_blank">
                <i class="fab fa-google"></i></a></button>  
        </div>
        <div class="footer-links">
            <p>Don't have an account? <a href="sign-up.html">Sign up</a></p>
        </div>
    </div>
  </div>
</html>

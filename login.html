<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="icon" type="image/x-icon" href="icon.ico?v=2" /> 
    <link rel="stylesheet" href="css/styles.css?v=1.2" />
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2 class="login-title">Welcome Back</h2>
                <p>Please enter your details to login</p>
            </div>
       
        <form action="/login" method="POST" id="loginForm" class="login-form" autocomplete="off" novalidate>
           <fieldset>
            <div class="form-group">
                <div class="input-wrapper">
                <label for="secondName">Surname:</label>
                <input type="text" id="secondName" name="secondName" required>
                </div>
                <span class="error-message" id="secondNameError">Error!</span>
            </div>
            <div class="form-group">
                <div class="input-wrapper">
                <label for="firstName">Name:</label>
                <input type="text" id="firstName" name="firstName" required>
                </div>
                <span class="error-message" id="firstNameError">Error!</span>
            </div>
            
            <div class="form-group">
                <div class="input-wrapper">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                </div>
                <span class="error-message" id="emailError">Error!</span>
            </div>
            <div class="form-group">
                <div class="input-wrapper password-wrapper">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>                
                <span class="error-message" id="passwordError">Error!</span>
            </div>
            <div class="form-group">
                <div class="input-wrapper password_confirm-wrapper">
                    <label for="passwordConfirm">Please, confirm your password:</label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" required>
                </div>                
                <span class="error-message" id="passwordConfirmError">Error!</span>
            </div>
             <div class="form-group">
                <div class="input-wrapper phone_number-wrapper">
                    <label for="phone"> Please, enter your phone number:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>                
                <span class="error-message" id="passwordConfirmError">Error!</span>
            </div>
            <div class="form-group">
                <div class="input-wrapper gender-wrapper">
                    <div class="radio-group">
                        <label>      
                        <input type="radio" name="gender" value="male"> Male
                        </label> 
                        <label>     
                        <input type="radio" class="gender-female" name="gender" value="female"> Female
                        </label>
                    </div>        
                </div> 
                <span class="error-message" id="genderChoiceError">Error!</span>               
            </div>
          </fieldset>
            <div class="form-options remember-wrapper">
                <label for="remember">Remember me</label>
                <input type="checkbox" id="remember" name="remember">
            </div>
            </div>
           
            <button type="submit" class="login-btn"></button>       
        </form>

        <div class="divider">
            <span class="login-span">or sign in with</span>
        </div>
        <div class="soc-options">
            <button class="soc-btn"><a href="https://www.github.com" target="_blank">
              <i class="fab fa-github"></i></a></button>
            <button class="soc-btn"><a href="https://www.google.com" target="_blank">
                <i class="fab fa-google"></i></a></button>  
        </div>
                <div class="footer-links">
            <p>Don't have an account? <a href="#">Sign up</a></p>
        </div>
    </div>
    </div>
</body>
</html>

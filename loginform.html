<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form </title>
    <link rel="icon" type="image/x-icon" href="icon.ico?v=2" />
    <link rel="stylesheet" href="css/loginform.css">
</head>

<body>

    <dialog id="logModal">
        <div class="modal-header">
            <h2>Access Your Account</h2>
            <button id="closeModalBtn" class="close-btn">&times;</button>
        </div>
        <p id="greeting" class="greeting">Please log in!</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="login">Логін:</label>
                <input type="text" id="login" name="login" data-valid="true" data-required="Введіть логін"
                    data-pattern="^[a-zA-Z][a-zA-Z0-9_-]{3,19}$" data-error-label="loginError" autocomplete="off">
                <span class="error-message" id="loginError"></span>
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" data-valid="true"
                        data-required="Введіть пароль" data-min-length="6" data-error-label="passwordError">
                    <button type="button" class="toggle-password" data-target="password" aria-label="Показати пароль">
                        <!-- Іконка відкритого ока (за замовчуванням прихована) -->
                        <svg class="eye-open hidden" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor"
                            stroke-width="2" fill="none">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <!-- Іконка закритого ока (показується першою) -->
                        <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor"
                            stroke-width="2" fill="none">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 
                            18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 
                            3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"> </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
                <span class="error-message" id="passwordError"></span>
            </div>
            <!-- Поле підтвердження пароля
            <div class="form-group">
                <label for="confirmPassword">Підтвердіть пароль:</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" data-valid="true"
                        data-required="Введіть підтвердження пароля" data-confirm="password" data-min-length="6"
                        data-error-label="passwordConfirmErrorLabel">

                    <button type="button" class="toggle-password" data-target="confirmPassword"
                        aria-label="Показати підтвердження пароля">
                        <svg hidden="true" class="eye-open hidden"
                            viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2"
                            fill="none">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor"
                            stroke-width="2" fill="none">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 
                            5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 
                            3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
                <span class="error-message" id="passwordConfirmErrorLabel"></span>
            </div> -->
            <div class="remember-wrapper">
                <label for="remember"></label>
                <input type="checkbox" id="remember" name="remember">
                <span>Remember me</span>
            </div>
            <div class="buttons-wrapper">
                <button type="submit" class="submit-btn">Увійти</button>
                <button type="reset" class="reset-btn">Відмінити</button>
            </div>

        </form>
    </dialog>
    <a class="back-link" href="index.html">Home</a>

    <script src="js/loginform.js"></script>
</body>

</html>

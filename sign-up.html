<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up page</title>
    <link rel="icon" type="image/x-icon" href="icon.ico?v=2" /> 
    <link rel="stylesheet" href="css/styles.css?v=1.2" />
</head>
<body class="sign-up-body">
    <div class="sign-up-container">
        <div class="sign-up-card">
            <div class="sign-up-header">
                <h2 class="sign-up-title">Create an Account</h2>
                <p>Please enter your details below</p>
            </div>
       
        <form action="/register" method="POST" id="signUpForm" class="sign-up-form" autocomplete="off" novalidate>
           <fieldset>
            <div class="form-group">
                <div class="input-wrapper">
                <label for="secondName">Surname:</label>
                <input type="text" id="secondName" name="secondName" required>
                </div>
                <span class="error-message" id="secondNameError">Error!</span>
            </div>
            <div class="form-group">
                <div class="input-wrapper">
                <label for="firstName">Name:</label>
                <input type="text" id="firstName" name="firstName" required>
                </div>
                <span class="error-message" id="firstNameError">Error!</span>
            </div>
            
            <div class="form-group">
                <div class="input-wrapper">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                </div>
                <span class="error-message" id="emailError">Error!</span>
            </div>
            <div class="form-group">
                <div class="input-wrapper password-wrapper">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>                
                <span class="error-message" id="passwordError">Error!</span>
            </div>
            <div class="form-group">
                <div class="input-wrapper password_confirm-wrapper">
                    <label for="passwordConfirm">Please, confirm your password:</label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" required>
                </div>                
                <span class="error-message" id="passwordConfirmError">Error!</span>
            </div>
             <div class="form-group">
                <div class="input-wrapper phone_number-wrapper">
                    <label for="phone"> Please, enter your phone number:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>                
                <span class="error-message" id="passwordConfirmError">Error!</span>
            </div>
            <div class="form-group">
                <div class="input-wrapper gender-wrapper">
                    <div class="radio-group">
                        <label>      
                        <input type="radio" name="gender" value="male"> Male
                        </label> 
                        <label>     
                        <input type="radio" class="gender-female" name="gender" value="female"> Female
                        </label>
                    </div>        
                </div> 
                <span class="error-message" id="genderChoiceError">Error!</span>               
            </div>
          </fieldset>          
            <button type="submit" class="submit-btn">Submit</button>       
        </form>
        <div class="footer-links">
            <p>Already have an account? <a href="login.html">Sign in</a></p>
        </div>
    </div>
    </div>
    <a href="index.html">Home</a>
</body>
</html>

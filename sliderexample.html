<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Slider Example</title>
    <link rel="icon" type="image/x-icon" href="icon.ico?v=2" />
    <link rel="stylesheet" href="css/slider.css" />
</head>

<body>
    <div id="main-gallery" class="gallery-container">
        <div class="main-view-wrapper">
            <button class="nav-btn prev-btn">❮</button>
            <div class="main-view">
                <img class="main-photo" src="img/musya.png" alt="Головне фото">
            </div>
            <button class="nav-btn next-btn">❯</button>
        </div>
        <div class="thumbnails-list">
            <img class="thumb active" src="img/musya.png" data-large="img/musya.png" data-index="0"
                alt="Прев'ю 1">
            <img class="thumb" src="img/lyusya.png" data-large="img/lyusya.png" data-index="1"
                alt="Прев'ю 2">
            <img class="thumb" src="img/filka.png" data-large="img/filka.png" data-index="2"
                alt="Прев'ю 3">
            <img class="thumb" src="img/musya2.png" data-large="img/musya2.png" data-index="3"
                alt="Прев'ю 4">
        </div>
    </div>
    <div>
        <a class="nav-btn" href="index.html">Home</a>
    </div>
   <script src="js/slider.js"></script> 
</body>

</html>
